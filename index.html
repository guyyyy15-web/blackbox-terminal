<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf1e7">
  <meta name="description" content="גלב תחזיר לי את הפלייסטישן">
  <meta property="og:title" content="גלב תחזיר לי את הפלייסטישן">
  <title>גלב תחזיר לי את הפלייסטישן</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
  <style>
    @font-face { font-family: 'Fredoka'; font-weight: 300 700; font-display: swap; src: url(fonts/fredoka-hebrew.woff2) format('woff2');
      unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    :root { --bg: #fcf1e7; --ink: #3a2340; --muted: #6b5371; --lilac: #e6d0ef; --lilac2: #f4e7f1; --plum: #7f4fa0; --sun: #f2c14e; --blush: #f4a9c4; --card: #fffaf5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1521; --ink: #f6ecf5; --muted: #c4afc8; --lilac: #46334f; --lilac2: #30243a; --plum: #c9a2e4; --card: #291f2f; }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    html, body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); }
    body { font-family: 'Fredoka', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px); position: relative; }
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .checker { position: absolute; background: repeating-conic-gradient(var(--lilac) 0 25%, var(--lilac2) 0 50%) 0 0 / 44px 44px; }
    .pad { width: min(300px, 70vw); height: auto; animation: wiggle 2.4s ease-in-out infinite; transform-origin: 50% 70%; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-6px); } }
    h1 { margin: 28px 0 0; max-width: 14ch; font-size: clamp(44px, 13vw, 104px); line-height: 1.02; font-weight: 700; letter-spacing: -0.01em; }
    h1 span { display: inline-block; background: var(--lilac); border-radius: 0.35em 0.45em 0.4em 0.5em; padding: 0.02em 0.22em 0.08em; margin-top: 0.08em; }
    p { margin: 22px 0 0; font-size: 18px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .pad { animation: none; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
  <div class="checker" style="top:-40px;left:-30px;width:260px;height:170px;border-radius:0 0 60% 40% / 0 0 70% 50%"></div>
  <div class="checker" style="bottom:-50px;right:-40px;width:300px;height:170px;border-radius:58% 42% 0 0 / 55% 45% 0 0"></div>
  </div>

  <svg class="pad" viewBox="0 0 300 190" role="img" aria-label="שלט של קונסולה" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 40 H230 Q268 40 280 80 L296 150 Q300 180 272 182 Q252 184 236 160 L218 134 H82 L64 160 Q48 184 28 182 Q0 180 4 150 L20 80 Q32 40 70 40z" fill="var(--card)"/>
    <path d="M78 74 v40 M58 94 h40" stroke-width="9"/>
    <circle cx="222" cy="72" r="9" fill="var(--sun)"/><circle cx="248" cy="96" r="9" fill="var(--blush)"/>
    <circle cx="196" cy="96" r="9" fill="#c9a3dd"/><circle cx="222" cy="120" r="9" fill="#7cc8e0"/>
    <circle cx="118" cy="138" r="14" fill="var(--lilac)"/><circle cx="182" cy="138" r="14" fill="var(--lilac)"/>
    <path d="M136 78 h28" stroke-width="5"/>
    <path d="M150 40 V14" stroke-width="4" stroke-dasharray="2 9"/>
  </svg>

  <h1>גלב <span>תחזיר לי</span> את הפלייסטישן</h1>
  <p>זה אצלך. כולם יודעים. 🎮</p>


  <script>
    // Remove the offline cache of the app that used to live here.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { if (new URL(r.scope).pathname === location.pathname.replace(/index\.html$/, '')) r.unregister() })
      })
    }
  </script>
</body>
</html>
